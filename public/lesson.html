*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fb);background:var(--bg);color:var(--txt)}body:before{content:'';position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.014) 3px,rgba(255,255,255,.014) 4px),radial-gradient(ellipse 70% 45% at 50% 0%,rgba(255,214,10,.12),transparent 68%)}

main{width:min(980px,100%);margin:0 auto;padding:clamp(2rem,5vw,4rem) 5vw}.eyebrow{color:var(--gold);font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:.8rem}h1{font-family:var(--fh);font-size:clamp(2rem,6vw,4.8rem);line-height:.95;margin-bottom:1rem}.sub{color:var(--muted);line-height:1.7;max-width:760px;margin-bottom:1.5rem}.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin:1rem 0}.panel h2{font-family:var(--fh);font-size:1.1rem;margin-bottom:.8rem}.panel p,.panel li{color:var(--muted);line-height:1.7}.panel ul{padding-left:1.3rem;display:grid;gap:.55rem}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid transparent;padding:.75rem 1.2rem;text-decoration:none;font-weight:800;color:var(--txt);cursor:pointer;font:inherit}.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}.btn-ghost{background:var(--surface2);border-color:var(--border)}.btn-danger{background:rgba(247,37,133,.12);border-color:rgba(247,37,133,.45)}.quiz{display:grid;gap:1rem}.q{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem}.q strong{display:block;margin-bottom:.7rem}.q label{display:block;color:var(--muted);margin:.4rem 0;line-height:1.5}.status{margin-top:1rem;color:var(--gold);font-weight:700;line-height:1.6}.status.error{color:#ff8ba7}.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--txt);font:inherit;padding:.8rem;margin-top:.6rem}.hidden{display:none}

<script>
const text={el:{classes:'Μαθήματα',lessonTitle:'Ύλη',quizTitle:'Τεστ',quizSub:'Πέρασε το τεστ για να ξεκλειδώσεις το πτυχίο. Μόλις ολοκληρώσεις ένα μάθημα, αυτή η συσκευή κλειδώνει μέχρι αύριο.',submit:'Υποβολή απαντήσεων',passed:'Πέρασες.',nameHelp:'Γράψε το όνομά σου για να κατεβάσεις το πτυχίο.',download:'Λήψη πτυχίου',back:'Πίσω στα μαθήματα',locked:'Σήμερα ολοκληρώθηκε ήδη μάθημα σε αυτή τη συσκευή. Μπορείς να διαβάσεις, αλλά νέο πτυχίο ξεκλειδώνει αύριο.',score:'Βαθμός',fail:'Χρειάζεσαι 3/3 σωστές απαντήσεις.',name:'Όνομα φοιτητή',cert:'ΠΙΣΤΟΠΟΙΗΤΙΚΟ ΓΕΛΙΟΥ',congrats:'Πέρασε επιτυχώς το μάθημα',teacher:'Υπεύθυνος'},en:{classes:'Classes',lessonTitle:'Lesson',quizTitle:'Quiz',quizSub:'Pass the quiz to unlock your diploma. Once you complete one lesson, this device is locked until tomorrow.',submit:'Submit answers',passed:'You passed.',nameHelp:'Enter your name to download the diploma.',download:'Download diploma',back:'Back to classes',locked:'A lesson has already been completed on this device today. You can study, but a new diploma unlocks tomorrow.',score:'Score',fail:'You need 3/3 correct answers.',name:'Student name',cert:'CERTIFICATE OF LAUGHTER',congrats:'Successfully passed the course',teacher:'Teacher'}};
const courses={
waves:{emoji:'🌊',teacher:'Sourdomemedon',el:{title:'Ιστορία Ανεργίας και Ειδίκευση στην Κυματολογία',intro:'Μάθημα για την τέχνη του να παρατηρείς τα κύματα, τα trends και την τεμπελιά με ακαδημαϊκή σοβαρότητα.',points:['Τα trends έρχονται σε κύματα. Μην τρέχεις πίσω από κάθε ένα, διάλεξε το σωστό timing.','Η ανεργία στα memes είναι στάση ζωής: παρατηρείς, περιμένεις, χτυπάς όταν όλοι έχουν κουραστεί.','Καλό wave post έχει απλή ιδέα, καθαρό punchline και σωστή στιγμή.'],q:[['Τι είναι βασικό στην Κυματολογία;', ['Το timing','Το spam','Τα πολλά hashtags'],0],['Πότε χτυπά ένα καλό wave post;', ['Όταν κουραστούν όλοι','Όταν η ιδέα είναι καθαρή','Όταν δεν υπάρχει internet'],1],['Τι πρέπει να αποφεύγεις;', ['Να κυνηγάς κάθε trend','Να έχεις punchline','Να παρατηρείς'],0]]},en:{title:'History of Unemployment and Waveology',intro:'A lesson on watching waves, trends, and laziness with academic seriousness.',points:['Trends arrive in waves. Do not chase every one; choose the right timing.','Meme unemployment is a lifestyle: observe, wait, post when everyone is tired.','A good wave post has a simple idea, clean punchline, and proper timing.'],q:[['What matters most in Waveology?', ['Timing','Spam','Too many hashtags'],0],['When does a good wave post work?', ['When everyone is tired','When the idea is clear','When there is no internet'],1],['What should you avoid?', ['Chasing every trend','Having a punchline','Observing'],0]]}},
rhetoric:{emoji:'📜',teacher:'THE LORD OF THE MEMES',el:{title:'Προπόνηση Χιουμοριστικής Ρητορικής',intro:'Μάθε να λες το αστείο σαν να υπερασπίζεσαι διδακτορικό στο γέλιο.',points:['Η ρητορική ξεκινά με καθαρή θέση: τι ακριβώς κοροϊδεύεις;','Το delivery μετράει όσο το κείμενο. Παύση πριν το punchline.','Μην εξηγείς υπερβολικά το αστείο. Άφησε χώρο στο κοινό.'],q:[['Τι χρειάζεται πρώτα η ρητορική;', ['Καθαρή θέση','Πέντε σελίδες εξήγηση','Caps lock'],0],['Τι βοηθά πριν το punchline;', ['Παύση','Άλλη ερώτηση','Αλλαγή θέματος'],0],['Τι σκοτώνει το αστείο;', ['Υπερβολική εξήγηση','Καθαρό delivery','Σύντομη ιδέα'],0]]},en:{title:'Humorous Rhetoric Training',intro:'Learn to deliver a joke like you are defending a PhD in laughter.',points:['Rhetoric starts with a clear position: what exactly are you mocking?','Delivery matters as much as text. Pause before the punchline.','Do not overexplain the joke. Leave room for the audience.'],q:[['What does rhetoric need first?', ['A clear position','Five pages of explanation','Caps lock'],0],['What helps before a punchline?', ['A pause','Another question','Changing subject'],0],['What kills a joke?', ['Overexplaining','Clear delivery','A short idea'],0]]}},
hot:{emoji:'🔥',teacher:'The Cool Teacher',el:{title:'Ανάλυση Καμένων Ανεκδότων',intro:'Τα καμένα αστεία δεν είναι λάθος. Είναι επιστήμη με υψηλή θερμοκρασία.',points:['Καμένο αστείο σημαίνει ότι η λογική λιώνει αλλά το γέλιο επιβιώνει.','Το παράλογο πρέπει να μοιάζει επίτηδες, όχι απλά τυχαίο.','Όσο πιο σοβαρά το πεις, τόσο καλύτερα καίει.'],q:[['Τι λιώνει στο καμένο αστείο;', ['Η λογική','Το κουμπί','Η σελίδα'],0],['Το παράλογο πρέπει να μοιάζει...', ['Επίτηδες','Κατά λάθος','Αόρατο'],0],['Πώς το λες καλύτερα;', ['Σοβαρά','Με συγγνώμη','Με επεξήγηση'],0]]},en:{title:'Burnt Joke Analysis',intro:'Burnt jokes are not mistakes. They are high-temperature science.',points:['A burnt joke melts logic while laughter survives.','Absurdity must feel intentional, not random.','The more seriously you say it, the better it burns.'],q:[['What melts in a burnt joke?', ['Logic','The button','The page'],0],['Absurdity should feel...', ['Intentional','Accidental','Invisible'],0],['How should you deliver it?', ['Seriously','With apology','With explanation'],0]]}},
cold:{emoji:'🥶',teacher:'The Cold Memer Teacher',el:{title:'Ανάλυση Κρύων Ανεκδότων',intro:'Το κρύο αστείο παγώνει την αίθουσα και μετά αφήνει το γέλιο να σπάσει τον πάγο.',points:['Το κρύο αστείο βασίζεται σε απλό λογοπαίγνιο ή αναπάντεχη σύνδεση.','Η αμηχανία είναι μέρος της επιτυχίας.','Μην το διορθώσεις μετά. Άφησέ το να παγώσει.'],q:[['Σε τι βασίζεται συχνά το κρύο αστείο;', ['Λογοπαίγνιο','Πολιτική ανάλυση','Μακρύ πρόλογο'],0],['Η αμηχανία είναι...', ['Μέρος της επιτυχίας','Πάντα αποτυχία','Άσχετη'],0],['Μετά το αστείο πρέπει να...', ['Το αφήσεις','Το εξηγήσεις για 10 λεπτά','Το διαγράψεις'],0]]},en:{title:'Cold Joke Analysis',intro:'A cold joke freezes the room and then lets laughter break the ice.',points:['A cold joke often relies on a pun or unexpected connection.','Awkward silence is part of the success.','Do not fix it afterward. Let it freeze.'],q:[['What does a cold joke often rely on?', ['A pun','Political analysis','A long intro'],0],['Awkward silence is...', ['Part of success','Always failure','Irrelevant'],0],['After the joke you should...', ['Let it sit','Explain for 10 minutes','Delete it'],0]]}},
cringe:{emoji:'😬',teacher:'The Principal',el:{title:'Εισαγωγή στην Cringe Αντίσταση',intro:'Η αντίσταση στο cringe χτίζει χαρακτήρα, ανοσία και γερά νεύρα.',points:['Cringe δεν σημαίνει πάντα κακό. Μερικές φορές είναι ωμό υλικό για meme.','Η πρώτη άμυνα είναι να αναγνωρίζεις την υπερβολή.','Η δεύτερη άμυνα είναι να μη γίνεσαι το ίδιο cringe στην απάντηση.'],q:[['Το cringe είναι πάντα κακό;', ['Όχι','Ναι','Μόνο Τρίτη'],0],['Πρώτη άμυνα είναι να αναγνωρίζεις...', ['Την υπερβολή','Τον καιρό','Το Wi-Fi'],0],['Στην απάντηση πρέπει να αποφύγεις...', ['Να γίνεις ίδιο cringe','Να σκεφτείς','Να γελάσεις'],0]]},en:{title:'Introduction to Cringe Resistance',intro:'Cringe resistance builds character, immunity, and strong nerves.',points:['Cringe is not always bad. Sometimes it is raw meme material.','The first defense is recognizing exaggeration.','The second defense is not becoming equally cringe in response.'],q:[['Is cringe always bad?', ['No','Yes','Only Tuesday'],0],['The first defense is recognizing...', ['Exaggeration','The weather','The Wi-Fi'],0],['In your response, avoid...', ['Becoming equally cringe','Thinking','Laughing'],0]]}},
templates:{emoji:'🎨',teacher:'Memedologia',el:{title:'Προχωρημένη Memeολογία & Template Δημιουργία',intro:'Τα templates είναι τα εργαστήρια όπου η ιδέα γίνεται αναπαραγώγιμη επιστήμη.',points:['Καλό template έχει καθαρό χώρο για κείμενο και άμεσα αναγνωρίσιμη κατάσταση.','Το ίδιο template πρέπει να σηκώνει πολλές παραλλαγές.','Μην γεμίζεις το meme με περιττή πληροφορία. Η οικονομία κειμένου κερδίζει.'],q:[['Καλό template χρειάζεται...', ['Καθαρό χώρο για κείμενο','Μικροσκοπικά γράμματα','Δέκα φίλτρα'],0],['Ένα template πρέπει να σηκώνει...', ['Πολλές παραλλαγές','Μόνο ένα αστείο','Καμία αλλαγή'],0],['Τι κερδίζει;', ['Οικονομία κειμένου','Περιττή πληροφορία','Μεγάλος πρόλογος'],0]]},en:{title:'Advanced Memeology and Template Creation',intro:'Templates are the labs where an idea becomes repeatable science.',points:['A good template has clean text space and an instantly recognizable situation.','The same template should support many variations.','Do not overload the meme with unnecessary information. Text economy wins.'],q:[['A good template needs...', ['Clean text space','Tiny letters','Ten filters'],0],['A template should support...', ['Many variations','Only one joke','No changes'],0],['What wins?', ['Text economy','Unnecessary info','A long intro'],0]]}}
};
function getCookie(n){return document.cookie.split('; ').find(r=>r.startsWith(n+'='))?.split('=')[1]||''}
function setCookieUntilMidnight(n,v){const x=new Date();x.setHours(24,0,0,0);document.cookie=`${n}=${encodeURIComponent(v)}; expires=${x.toUTCString()}; path=/; SameSite=Lax`}
function today(){return new Date().toISOString().slice(0,10)} function lang(){return localStorage.getItem('ls-language')||'el'} function tr(k){return text[lang()][k]} function setLanguage(v){localStorage.setItem('ls-language',v);render()}
const course=courses[new URLSearchParams(location.search).get('course')]||courses.cold; let passed=false;
function render(){const l=lang();document.documentElement.lang=l;document.title=`${course[l].title} | LAUGH SCHOOL™`;document.getElementById('languageSelect').value=l;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.getElementById('teacher').textContent=`${course.emoji} ${course.teacher}`;document.getElementById('title').textContent=course[l].title;document.getElementById('intro').textContent=course[l].intro;document.getElementById('points').innerHTML=course[l].points.map(p=>`<li>${p}</li>`).join('');document.getElementById('quiz').innerHTML=course[l].q.map((q,i)=>`<div class="q"><strong>${i+1}. ${q[0]}</strong>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div>`).join('');document.getElementById('studentName').placeholder=tr('name');if(getCookie('ls_lesson_day')===today()&&!passed){document.getElementById('status').textContent=tr('locked');document.getElementById('status').className='status error'}}
function gradeQuiz(){if(getCookie('ls_lesson_day')===today()){document.getElementById('status').textContent=tr('locked');document.getElementById('status').className='status error';return}let score=0;course[lang()].q.forEach((q,i)=>{const checked=document.querySelector(`input[name=q${i}]:checked`);if(checked&&Number(checked.value)===q[2])score++});document.getElementById('status').textContent=`${tr('score')}: ${score}/3`;document.getElementById('status').className=score===3?'status':'status error';if(score===3){passed=true;setCookieUntilMidnight('ls_lesson_day',today());setCookieUntilMidnight('ls_lesson_course',new URLSearchParams(location.search).get('course')||'cold');document.getElementById('diplomaPanel').classList.remove('hidden')}else{document.getElementById('status').textContent+=`. ${tr('fail')}`}}
function downloadDiploma(){const name=document.getElementById('studentName').value.trim()||tr('name');const date=new Date().toLocaleDateString(lang()==='el'?'el-GR':'en-US',{year:'numeric',month:'long',day:'numeric'});const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>LAUGH SCHOOL Diploma</title><style>body{margin:0;background:#151515;display:grid;place-items:center;min-height:100vh;font-family:Georgia,serif}.page{width:800px;min-height:540px;background:#fffdf4;color:#1a1506;text-align:center;padding:70px;border:14px double #b8922a}.school{letter-spacing:4px;font-weight:bold}.cert{font-size:34px;color:#9c761a;margin:34px 0 18px}.name{font-size:34px;margin:24px 0;border-bottom:1px solid #b8922a;display:inline-block;padding:0 40px}.small{color:#66552b}.course{font-size:22px;font-weight:bold;margin:20px 0}</style></head><body><div class="page"><div class="school">LAUGH SCHOOL™</div><div class="cert">${tr('cert')}</div><p class="small">${tr('congrats')}</p><div class="name">${name}</div><div class="course">${course.emoji} ${course[lang()].title}</div><p>${tr('teacher')}: ${course.teacher}</p><p class="small">${date}</p></div></body></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='laugh_school_diploma.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script>
