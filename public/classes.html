<style>
:root{--bg:#0F0F13;--surface:#17171E;--surface2:#1F1F2A;--border:rgba(255,255,255,.08);--gold:#FFD60A;--gold2:#FF9500;--pink:#F72585;--txt:#EEEEF5;--muted:#8B8BAC;--fh:'Unbounded',sans-serif;--fb:'Noto Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0} body{font-family:var(--fb);background:var(--bg);color:var(--txt)} body:before{content:'';position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.014) 3px,rgba(255,255,255,.014) 4px),radial-gradient(ellipse 70% 45% at 50% 0%,rgba(255,214,10,.12),transparent 68%)}
header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 5vw;background:rgba(15,15,19,.92);border-bottom:1px solid rgba(255,214,10,.18);position:sticky;top:0;z-index:5;backdrop-filter:blur(20px)}
.logo{font-family:var(--fh);font-weight:900;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.top{display:flex;gap:.75rem;align-items:center}.select{background:var(--surface2);border:1px solid var(--border);border-radius:999px;color:var(--txt);font:inherit;font-size:.82rem;font-weight:700;padding:.45rem .8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid transparent;padding:.75rem 1.2rem;text-decoration:none;font-weight:800;color:var(--txt);cursor:pointer}.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}.btn-ghost{background:var(--surface2);border-color:var(--border)}
main{width:min(1120px,100%);margin:0 auto;padding:clamp(2rem,5vw,5rem) 5vw}.eyebrow{color:var(--gold);font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:.8rem}h1{font-family:var(--fh);font-size:clamp(2.4rem,7vw,5.8rem);line-height:.92;margin-bottom:1rem}.sub{color:var(--muted);line-height:1.7;max-width:740px;margin-bottom:2.2rem}
.notice{background:rgba(255,214,10,.07);border:1px solid rgba(255,214,10,.28);border-radius:10px;padding:1rem 1.2rem;margin-bottom:1.4rem;color:var(--gold);font-weight:700;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;gap:.8rem}.card:hover{border-color:rgba(255,214,10,.35)}.emoji{font-size:2rem}.card h2{font-family:var(--fh);font-size:1rem;line-height:1.35}.card p{color:var(--muted);font-size:.9rem;line-height:1.6}.meta{font-size:.74rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px}.card .btn{margin-top:auto}
@media(max-width:640px){header{padding:0 1rem}.top .btn{display:none}main{padding:2rem 1rem}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">😂 LAUGH SCHOOL™</a>
  <div class="top">
    <a class="btn btn-ghost" href="/" data-i18n="home">Home</a>
    <select class="select" id="languageSelect" onchange="setLanguage(this.value)">
      <option value="el">EL</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>
<main>
  <div class="eyebrow" data-i18n="eyebrow">Student Classes</div>
  <h1 data-i18n="title">Μαθήματα</h1>
  <p class="sub" data-i18n="sub">Διάλεξε ένα μάθημα, διάβασε την ύλη και πέρασε το μικρό τεστ. Μόνο ένα μάθημα μπορεί να ολοκληρωθεί ανά συσκευή κάθε μέρα.</p>
  <div class="notice" id="lockNotice"></div>
  <div class="grid" id="courseGrid"></div>
</main>
<script>
const text = {
  el:{home:'Αρχική',eyebrow:'Μαθήματα Φοιτητών',title:'Μαθήματα',sub:'Διάλεξε ένα μάθημα, διάβασε την ύλη και πέρασε το μικρό τεστ. Μόνο ένα μάθημα μπορεί να ολοκληρωθεί ανά συσκευή κάθε μέρα.',open:'Άνοιγμα μαθήματος',teacher:'Καθηγητής',difficulty:'Δυσκολία',free:'Σήμερα μπορείς να ολοκληρώσεις ένα μάθημα.',locked:'Σήμερα έχει ήδη ολοκληρωθεί μάθημα σε αυτή τη συσκευή. Επιστροφή αύριο για το επόμενο.'},
  en:{home:'Home',eyebrow:'Student Classes',title:'Classes',sub:'Choose a lesson, study the material, and pass the short quiz. Only one lesson can be completed per device each day.',open:'Open lesson',teacher:'Teacher',difficulty:'Difficulty',free:'Today you can complete one lesson.',locked:'A lesson has already been completed on this device today. Come back tomorrow for the next one.'}
};
const courses=[
 {id:'waves',emoji:'🌊',teacher:'Sourdomemedon',stars:'⭐⭐⭐⭐⭐',el:'Ιστορία Ανεργίας και Ειδίκευση στην Κυματολογία',en:'History of Unemployment and Waveology'},
 {id:'rhetoric',emoji:'📜',teacher:'THE LORD OF THE MEMES',stars:'⭐⭐⭐⭐⭐',el:'Προπόνηση Χιουμοριστικής Ρητορικής',en:'Humorous Rhetoric Training'},
 {id:'hot',emoji:'🔥',teacher:'The Cool Teacher',stars:'⭐⭐⭐⭐⭐',el:'Ανάλυση Καμένων Ανεκδότων',en:'Burnt Joke Analysis'},
 {id:'cold',emoji:'🥶',teacher:'The Cold Memer Teacher',stars:'⭐⭐⭐⭐⭐',el:'Ανάλυση Κρύων Ανεκδότων',en:'Cold Joke Analysis'},
 {id:'cringe',emoji:'😬',teacher:'The Principal',stars:'⭐⭐⭐⭐',el:'Εισαγωγή στην Cringe Αντίσταση',en:'Introduction to Cringe Resistance'},
 {id:'templates',emoji:'🎨',teacher:'Memedologia',stars:'⭐⭐⭐⭐⭐',el:'Προχωρημένη Memeολογία & Template Δημιουργία',en:'Advanced Memeology and Template Creation'}
];
function getCookie(name){return document.cookie.split('; ').find(r=>r.startsWith(name+'='))?.split('=')[1]||''}
function today(){return new Date().toISOString().slice(0,10)}
function lang(){return localStorage.getItem('ls-language')||'el'}
function tr(k){return text[lang()][k]}
function setLanguage(value){localStorage.setItem('ls-language',value);render()}
function render(){
 document.documentElement.lang=lang(); document.getElementById('languageSelect').value=lang();
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
 const locked=getCookie('ls_lesson_day')===today();
 document.getElementById('lockNotice').textContent=locked?tr('locked'):tr('free');
 document.getElementById('courseGrid').innerHTML=courses.map(c=>`<article class="card"><div class="emoji">${c.emoji}</div><h2>${c[lang()]}</h2><div class="meta">${tr('teacher')}: ${c.teacher}</div><p>${tr('difficulty')}: ${c.stars}</p><a class="btn btn-gold" href="/lesson.html?course=${c.id}">${tr('open')}</a></article>`).join('');
}
render();
</script>
</body>
</html>
